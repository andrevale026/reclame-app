server:
  port: ${PORT:5000}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reclame}?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Campo_Grande&sslMode=${DB_SSL_MODE:DISABLED}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

reclame:
  encryption-key: ${ENCRYPTION_KEY:}

  email:
    ouvidoria: ${EMAIL_OUVIDORIA:}
    coordenacao: ${EMAIL_COORDENACAO:}
    prefeitura-academica: ${EMAIL_PREFEITURA_ACADEMICA:}